name: Changelog policy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  changelog:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out candidate revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Fetch comparison base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          zero=0000000000000000000000000000000000000000
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "$zero" ] && ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi

      - name: Enforce changelog policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/changelog_guard.py "$BASE_SHA" "$HEAD_SHA"

      - name: Run changelog guard tests
        run: python -m unittest discover -s tools/tests -p "test_changelog_guard.py"
